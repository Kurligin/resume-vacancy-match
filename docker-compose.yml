# docker compose up — демо без ключа: вход по роли, демо-данные, ответы модели из кэша.
# Свои настройки — в .env (образец .env.example), он необязателен.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      RVM_DEMO_LOGIN: ${RVM_DEMO_LOGIN:-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.6-35b-a3b}
      RVM_SEED: ${RVM_SEED:-1}
    volumes:
      - rvm-var:/app/var
    restart: unless-stopped

  # Закрытый контур: модель локально, данные не уходят наружу.
  # docker compose --profile local up; в .env: LLM_BASE_URL=http://ollama:11434/v1,
  # LLM_API_KEY=ollama, LLM_MODEL=<модель>; модель скачать:
  # docker compose exec ollama ollama pull <модель>
  ollama:
    image: ollama/ollama
    profiles: [local]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # Почта для показа (GreenMail): SMTP mail:3025 и IMAP mail:3143 без TLS, порты наружу не
  # публикуются — ящик виден только внутри сети compose, поэтому пароль по умолчанию «demo».
  # Запуск со стеком (app получает RVM_IMAP_* из docker-compose.mail.yml):
  #   docker compose -f docker-compose.yml -f docker-compose.mail.yml --profile mail up -d
  # Демо-отклик: docker compose exec app python scripts/send_demo_mail.py \
  #   "data/demo/Резюме А.txt" --vacancy "<название вакансии>"
  mail:
    image: greenmail/standalone:2.1.15
    profiles: [mail]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=hr:${RVM_DEMO_MAIL_PASSWORD:-demo}@rvm.local
    restart: unless-stopped

volumes:
  rvm-var:
  ollama:
