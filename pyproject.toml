[project]
name = "rvm"
version = "0.1.0"
description = "Сопоставление резюме и вакансий: статусы требований с цитатами, рейтинг, выводы для рекрутера"
readme = "README.md"
authors = [
    { name = "ivan", email = "68651449+Kurligin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "natasha>=1.6.0",
    "openai>=3.49.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.3",
    "pymorphy3>=2.0.6",
    "pypdf>=7.0.1",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "striprtf>=0.0.35",
    "uvicorn>=0.54.0",
]

[project.scripts]
rvm = "rvm:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["eval"]
