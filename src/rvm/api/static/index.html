<div class="login" id="login" hidden>
  <div class="lg">
    <span class="mark"><svg class="i"><use href="#i-logo"/></svg></span>
    <h1>Сверка</h1>
    <div class="tag">Подбор вакансий МФТИ по резюме</div>
    <form class="card lgc" id="lgform">
      <label class="fld"><span>Логин</span><input name="login" autocomplete="username" aria-label="Логин" required></label>
      <label class="fld"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" aria-label="Пароль" required></label>
      <div class="lgerr" id="lgerr" role="alert"></div>
      <button class="btn btn-primary" type="submit">Войти</button>
    </form>
    <div id="demo" hidden>
      <div class="demo-h">Демо-доступ — вход в один клик</div>
      <button class="role" data-login="recruiter"><span class="avatar blue"><svg class="i"><use href="#i-user"/></svg></span><span><b>Рекрутер</b><small>Анна Смирнова · разбор откликов, кандидаты, вакансии</small></span><svg class="i go"><use href="#i-arrow"/></svg></button>
      <button class="role" data-login="manager"><span class="avatar green"><svg class="i"><use href="#i-brief"/></svg></span><span><b>Нанимающий руководитель</b><small>Олег Волков · кандидаты, которых прислал рекрутер</small></span><svg class="i go"><use href="#i-arrow"/></svg></button>
      <button class="tour-link" type="button" data-tour-go>Как это работает — 2 минуты</button>
    </div>
  </div>
</div>

<header class="bar">
  <a class="logo" href="#/candidates"><span class="mark"><svg class="i"><use href="#i-logo"/></svg></span>Сверка</a>
  <nav class="nav" aria-label="Разделы">
    <a class="navlink" href="#/triage" data-sec="triage" data-rec><svg class="i"><use href="#i-inbox"/></svg>Разбор<span class="badge num" id="trbadge"></span></a>
    <a class="navlink" href="#/candidates" data-sec="candidates"><svg class="i"><use href="#i-users"/></svg>Кандидаты<span class="badge num" id="navbadge"></span></a>
    <a class="navlink" href="#/vacancies" data-sec="vacancies" data-rec><svg class="i"><use href="#i-brief"/></svg>Вакансии</a>
  </nav>
  <span class="spacer"></span>
  <button class="btn btn-ghost" data-tour-open data-rec aria-label="Как это работает: тур по сценариям"><svg class="i i-sm"><use href="#i-help"/></svg>Тур</button>
  <button class="btn btn-primary" data-upload data-rec><svg class="i i-sm"><use href="#i-upload"/></svg>Загрузить</button>
  <span class="me"><span class="avatar blue"><svg class="i"><use href="#i-user"/></svg></span><span id="mename"></span><button id="logout">Выйти</button></span>
</header>

<main class="wrap">
  <div class="left">
    <div id="top"></div>
    <div class="card summary" id="summary" hidden></div>
    <div class="card detail" id="detail" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="req"><svg class="i"><use href="#i-list"/></svg>Требования</button>
        <button role="tab" aria-selected="false" data-tab="qs"><svg class="i"><use href="#i-chat"/></svg>Вопросы <span class="cnt num" id="qcnt"></span></button>
        <button role="tab" aria-selected="false" data-tab="mail" data-rec><svg class="i"><use href="#i-mail"/></svg>Письмо</button>
      </div>
      <div class="pane" id="pane"></div>
    </div>
  </div>
  <aside class="card doc" id="doc" aria-label="Карточка и текст резюме"></aside>
</main>
<script type="module" src="/app.js"></script>
<script type="module" src="/tour.js"></script>
