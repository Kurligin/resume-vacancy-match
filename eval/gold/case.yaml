         variants: ["верстка макетов Figma на HTML CSS JS", "верстка макетов с нуля"]}
      - {key: adaptive, section: inferred, review: true, text: "Адаптивная и кроссбраузерная верстка",
         variants: ["адаптивная кроссбраузерная верстка"]}
      - {key: office, section: condition, review: true, text: "Работа в Долгопрудном, гибрид, график 5/2",
