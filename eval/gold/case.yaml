      - {key: clean_code, section: must, text: "Аккуратность в коде (читаемость)",
         variants: ["аккуратность в коде", "читаемость кода"]}
      - {key: team, section: must, text: "Готовность работать в небольшой команде",
         variants: ["работа в небольшой команде", "готовность работать в команде"]}
      - {key: ssr, section: nice, text: "Понимание разницы между SSR и SPA",
         variants: ["понимание SSR и SPA", "разница SSR SPA"]}
      - {key: pinia_nuxt, section: nice, text: "Опыт работы с Pinia, Nuxt, Monaco Editor",
         variants: ["Pinia Nuxt Monaco Editor", "опыт работы с Pinia", "опыт работы с Nuxt"]}
      - {key: figma, section: nice, text: "Знание Figma (работа с макетом, экспорт ресурсов)",
         variants: ["знание Figma", "Figma работа с макетом экспорт ресурсов"]}
      - {key: letter, section: nice, section_alt: [must, condition], review: true,
         text: "В сопроводительном письме указать, где использовался Vue.js, подходит ли офис и сколько займёт дорога",
         variants: ["сопроводительное письмо проекты на Vue.js", "указать в письме опыт Vue.js и время дороги до офиса"]}
