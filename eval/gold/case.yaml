# Эталон ожиданий по данным кейса: 4 резюме × 3 вакансии.
# Это наша ручная разметка, а не разметка организаторов. Файлы кейса в git не лежат:
# эталон ссылается на них по имени внутри папки --data.
#
# Требование: key — ключ эталона; section — ожидаемый раздел (must/nice/inferred/condition),
# section_alt — допустимые иные разделы; variants — формулировки для нечёткого сопоставления
# с извлечёнными требованиями.
# Статус: s — ожидаемый (full/partial/"no"/unknown; no в кавычках, иначе YAML прочтёт false),
# alt — допустимые альтернативы,
# why — обоснование со ссылкой на фразу, review: true — решение без опоры на ручной разбор,
# его нужно проверить.
# Резюме: order — ожидаемый порядок вакансий; redirect — ожидаемая переадресация (null — нет);
# discrepancy — ждём расхождение заявленного стажа (null — не проверяем);
# snapshot_note — подстрока пометки «резюме, похоже, от …» (null — не проверяем).

today: 2026-10-15  # review: дата, на которую написаны резюме кейса (стаж Иванова «2 года 10 мес»)

vacancies:
