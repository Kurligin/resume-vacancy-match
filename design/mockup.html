<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сверка — макет</title>
<style>
:root{
  --bg:#f5f5f7; --surface:#fff; --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b;
  --line:rgba(0,0,0,.08); --accent:#0071e3; --accent-soft:#e8f1fc;
  --full:#1f7a3a; --full-bg:#e6f4ea; --part:#9a5b00; --part-bg:#fff3e0;
  --no:#c4001a; --no-bg:#fdecee; --unk:#5b5b60; --unk-bg:#efeff4;
  --hl:#fff4c2; --radius:16px;
  --spring:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:13px;height:13px}
.i-lg{width:20px;height:20px}
.c-full{color:var(--full)} .c-part{color:var(--part)} .c-acc{color:var(--accent)} .c-no{color:var(--no)}

/* Верхняя панель — полупрозрачный материал */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;
  background:rgba(245,245,247,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#3a8dff,#0058d0);box-shadow:0 1px 2px rgba(0,60,160,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.mark .i{width:17px;height:17px;stroke-width:2.2}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:9px;padding:2px;margin:0 auto}
.seg button{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--fg2);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:980px;font-size:13px;font-weight:500;transition:transform .1s ease-out,background .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#0077ed}
.btn-ghost{background:rgba(0,0,0,.05)}
.btn-ghost:hover{background:rgba(0,0,0,.08)}
.btn-white{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mock-tag{font-size:11px;color:var(--fg3);border:1px solid var(--line);border-radius:6px;padding:2px 6px}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;max-width:1360px;margin:0 auto;padding:24px}
.left>*+*,#top>*+*{margin-top:16px}

/* Шапка */
.head{display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#a1a1aa,#6e6e73)}
.avatar.blue{border-radius:15px;background:linear-gradient(145deg,#3a8dff,#0058d0)}
.avatar .i{width:26px;height:26px;stroke-width:1.6}
.head .who{flex:1;min-width:0}
.head h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--fg2);margin-top:5px;font-size:14px}
.sub span{display:inline-flex;align-items:center;gap:5px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2);white-space:nowrap}
.tog{width:38px;height:22px;border-radius:11px;background:#d1d1d6;position:relative;transition:background .25s var(--spring)}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.tog[aria-checked=true]{background:#34c759}
.tog[aria-checked=true]::after{transform:translateX(16px)}
.avs{display:flex;gap:6px}
.av{width:30px;height:30px;border-radius:50%;background:#e5e5ea;color:var(--fg2);font-size:12px;font-weight:600;display:grid;place-items:center;transition:box-shadow .2s,background .2s}
.av:hover{background:#dcdce1}
.av[aria-pressed=true]{background:#fff;color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

/* Плашки-подсказки */
.callout{display:flex;gap:12px;align-items:center;border-radius:var(--radius);padding:14px 16px;
  background:linear-gradient(120deg,#eaf2fd 0%,#eeeefc 100%);border:1px solid rgba(0,113,227,.12)}
.callout b{font-weight:600}
.callout .ico{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,113,227,.3)}
.callout .btn{margin-left:auto;flex:none}

/* Карточки и рейтинг */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04)}
.rank{overflow:hidden}
.rrow{display:grid;grid-template-columns:40px minmax(0,1fr) 150px 120px;align-items:center;gap:16px;width:100%;text-align:left;padding:14px 18px;border-top:1px solid var(--line);transition:background .15s}
.rrow:first-child{border-top:0}
.rrow:hover{background:rgba(0,0,0,.02)}
.rrow[aria-selected=true]{background:#f7f9fd;box-shadow:inset 3px 0 0 var(--accent)}
.rrow.close{box-shadow:inset 3px 0 0 #b9cdf0}
.rrow.close[aria-selected=true]{box-shadow:inset 3px 0 0 var(--accent)}
.tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;position:relative}
.tile.round{border-radius:50%}
.tile .i{width:19px;height:19px}
.tile em{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;border-radius:9px;background:#fff;color:var(--fg2);font:600 11px/18px -apple-system,system-ui,sans-serif;text-align:center;font-style:normal;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.t-ok{background:var(--full-bg);color:var(--full)} .t-mid{background:var(--part-bg);color:var(--part)} .t-bad{background:var(--unk-bg);color:var(--unk)}
.rrow .t{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--fg2)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .bl{color:var(--no)} .meta .ex{color:var(--accent)} .meta .cl{color:var(--part)}
.score{display:flex;align-items:center;gap:10px}
.score .n{font-size:22px;font-weight:600;letter-spacing:-.02em;width:34px}
.range{position:relative;flex:1;height:6px;background:#ececf0;border-radius:3px}
.range i{position:absolute;top:0;bottom:0;background:rgba(0,113,227,.22);border-radius:3px}
.range b{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--accent)}
.lbl{display:block;font-size:11px;color:var(--fg3);margin-top:3px}
.verdict{justify-self:end;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:980px;white-space:nowrap}
.v-ok{background:var(--full-bg);color:var(--full)} .v-mid{background:var(--part-bg);color:var(--part)} .v-bad{background:var(--unk-bg);color:var(--unk)}

/* Обзор: тепловая карта */
.heat{padding:14px 18px 12px}
.heat-h{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--fg2);margin-bottom:8px}
.heat-h b{color:var(--fg);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.legend{display:flex;gap:12px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hg{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,72px);gap:4px 6px;align-items:center}
.hg .ch{font-size:12px;color:var(--fg3);text-align:center;font-weight:600}
.hname{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border-radius:10px;font-weight:500;font-size:14px;transition:background .15s}
.hname:hover{background:#f5f5f7}
.hname.on{background:#f7f9fd;color:var(--accent)}
.hcell{height:36px;border-radius:9px;font-weight:600;font-size:14px;display:grid;place-items:center;transition:transform .15s var(--spring),box-shadow .15s}
.hcell:hover{transform:scale(1.04)}
.hcell.on{box-shadow:0 0 0 2px var(--accent)}
.hcell.s-full{background:var(--full-bg);color:var(--full)} .hcell.s-partial{background:var(--part-bg);color:var(--part)} .hcell.s-unknown{background:var(--unk-bg);color:var(--unk)}

/* Разбор близких */
.pair{padding:18px}
.pair h3{display:flex;align-items:center;gap:8px;font-size:17px;letter-spacing:-.01em}
.pair .lead{color:var(--fg2);margin:4px 0 8px;font-size:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0 6px}
.vs .side-c{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#f7f7f9}
.vs .side-c.win{background:var(--full-bg)}
.vs .vs-n{font-size:20px;font-weight:600;margin-left:auto}
.vs .mid{font-size:12px;font-weight:600;color:var(--fg3)}
.agree{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg2);margin:8px 0 2px}
.agree .dots{display:flex;gap:3px}
.agree .dots i{width:8px;height:8px;border-radius:50%;background:#e0e0e5}
.agree .dots i.y{background:var(--full)}

/* Кратко */
.summary{padding:16px 18px 14px}
.sum-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.sum-h .of{font-weight:400;color:var(--fg2);font-size:13px}
.sum-cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px;margin-top:6px}
.h3{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--fg2);margin-top:8px}
.pt{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;padding:7px 8px;margin:0 -8px;border-radius:9px;font-size:14px;transition:background .15s}
.pt:hover{background:#f5f5f7}
.pt>.i{margin-top:3px}
.pt.on{background:var(--hl)}
.ref{font:600 11px/1 ui-monospace,SFMono-Regular,monospace;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:3px 5px;margin-left:6px}
.rec{display:flex;gap:10px;background:#f7f9fd;border-radius:12px;padding:12px 14px;margin:8px 0 2px;font-size:14px}
.rec .i{margin-top:3px}

/* Вкладки */
.detail{padding:6px 0 8px}
.tabs{display:flex;gap:4px;padding:8px 14px 0}
.tabs button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--fg2);transition:background .15s,color .15s}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected=true]{color:var(--fg);background:rgba(0,0,0,.05)}
.tabs .cnt{font-size:11px;font-weight:600;color:var(--fg3);background:rgba(0,0,0,.05);border-radius:6px;padding:0 5px}
.pane{padding:4px 18px 10px}
.pane.enter{animation:enter .28s var(--spring)}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.why{font-size:13px;color:var(--fg2);padding:10px 0 4px}
.why b{color:var(--fg);font-weight:600}
.grp{font-size:12px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;padding:16px 0 6px}
.req{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;width:100%;text-align:left;padding:10px;margin:0 -10px;border-radius:11px;transition:background .15s}
.req:hover,.req.on{background:#f5f5f7}
.req .txt{font-weight:500}
.req .q{font-size:13px;color:var(--fg2);margin-top:2px}
.req .q code{font:600 11px/1 ui-monospace,SFMono-Regular,monospace;color:var(--fg3);margin-right:4px}
.req .q .ask{display:inline-flex;align-items:center;gap:4px;color:var(--accent)}
.flag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--fg2);background:#f0f0f3;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.flag.plus{background:var(--accent-soft);color:var(--accent)}
.flag.warn{background:var(--part-bg);color:var(--part)}
.st{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap;align-self:start}
.st .i{width:13px;height:13px;stroke-width:2.4}
.s-full{color:var(--full);background:var(--full-bg)} .s-partial{color:var(--part);background:var(--part-bg)}
.s-no{color:var(--no);background:var(--no-bg)} .s-unknown{color:var(--unk);background:var(--unk-bg)}
.list{list-style:none;padding:4px 0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list li>.i{margin-top:3px}
.letter{white-space:pre-wrap;background:#fafafc;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:14px;margin-top:10px}
.actions{display:flex;align-items:center;gap:8px;margin-top:12px}
.stub{display:flex;gap:10px;align-items:center;color:var(--fg2);font-size:14px;padding:16px 0}

/* Текст резюме */
.doc{position:sticky;top:80px;max-height:calc(100vh - 104px);overflow:auto;padding:14px 0;align-self:start}
.doc h2{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--fg2);padding:0 18px 8px}
.blk{font-size:11px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;padding:12px 18px 4px}
.ln{display:grid;grid-template-columns:30px 1fr;gap:6px;padding:3px 18px;font-size:13px;line-height:1.45;transition:background .35s var(--spring)}
.ln > span:first-child{color:#c7c7cc;font-variant-numeric:tabular-nums;text-align:right}
.ln.hl{background:var(--hl)}
.ln.hl mark{background:#ffe27a;border-radius:3px}
mark{background:none;color:inherit}
.mask{display:inline-flex;align-items:center;gap:4px;background:#ececf0;color:var(--fg2);border-radius:5px;padding:0 6px;font-size:12px}

@media (max-width:980px){.wrap{grid-template-columns:1fr}.doc{position:static;max-height:none}.rrow{grid-template-columns:40px 1fr 90px}.rrow .verdict{display:none}.sum-cols{grid-template-columns:1fr}.hg{grid-template-columns:minmax(0,1fr) repeat(4,44px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-transparency:reduce){.bar{background:var(--bg);backdrop-filter:none}}
</style>
</head>

  if(el){
    if(el.dataset.vac&&el.dataset.cand){st.vac=el.dataset.vac;st.cand=el.dataset.cand;}
    else if(el.dataset.vac){st.vac=el.dataset.vac; if(st.view==='vac'){st.cand=bestCand(st.vac);st.pair=false;}}
    else {st.cand=el.dataset.cand; if(st.view==='cand') st.vac=bestVac(st.cand);}
    render(); return;}
  const tb=t.closest('[data-tab]'); if(tb){st.tab=tb.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b===tb));renderPane();return;}
  const rq=t.closest('.req'); if(rq){document.querySelectorAll('.req.on').forEach(b=>b.classList.remove('on'));rq.classList.add('on');highlight(D[key(st.cand,st.vac)].req[rq.dataset.i][3]);return;}
  const pt=t.closest('.pt[data-l]'); if(pt){document.querySelectorAll('.pt.on').forEach(b=>b.classList.remove('on'));pt.classList.add('on');highlight([[+pt.dataset.l,'']]);return;}
});
render();
</script>
</body>
</html>
